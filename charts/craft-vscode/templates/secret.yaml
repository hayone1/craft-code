{{- if not .Values.auth.existingSecret }}
{{- /* Made once; an upgrade keeps the values already in the cluster. */}}
{{- $name := include "craft-vscode.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "craft-vscode.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ .Values.auth.password | b64enc | default (get $old "password") | default (randAlphaNum 24 | b64enc) | quote }}
  mcp-key: {{ get $old "mcp-key" | default (randAlphaNum 32 | b64enc) | quote }}
  mint-token: {{ get $old "mint-token" | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
