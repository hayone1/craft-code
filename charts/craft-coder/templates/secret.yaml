{{- if not .Values.existingSecret }}
{{- /* Made once; an upgrade keeps the values already in the cluster. */}}
{{- $name := include "craft-coder.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "craft-coder.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ get $old "admin-password" | default (.Values.admin.password | b64enc) | default (randAlphaNum 24 | b64enc) | quote }}
  mcp-key: {{ get $old "mcp-key" | default (randAlphaNum 32 | b64enc) | quote }}
  mint-token: {{ get $old "mint-token" | default (randAlphaNum 32 | b64enc) | quote }}
  {{- if .Values.postgres.enabled }}
  pg-password: {{ get $old "pg-password" | default (randAlphaNum 32 | b64enc) | quote }}
  {{- else if .Values.postgres.externalUrl }}
  pg-url: {{ .Values.postgres.externalUrl | b64enc | quote }}
  {{- end }}
{{- end }}
