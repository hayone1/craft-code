{{- if .Values.httpRoute.enabled }}
{{- $full := include "craft-studio.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}
  labels:
    {{- include "craft-studio.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute needs parentRefs" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    - {{ required "httpRoute needs host" .Values.host | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: {{ $full }}, port: 8080 }
{{- end }}
