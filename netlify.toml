# The craft app pages as a static site (static/build.mjs). Netlify serves files only, so this
# deploys the apps and nothing else: no VS Code, no relay. See README.md.
[build]
  command = "node static/build.mjs public"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*/_embed/config.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Asked on the "Deploy to Netlify" page. Not in [build.environment]: a value there would win over
# the answer. Empty: every app (static/build.mjs).
[template.environment]
  CRAFT_APPS = "Leave empty for all eight craft apps, or list the apps that you want with commas between them. All the apps: photocraft,vectorcraft,lightcraft,filmcraft,effectcraft,wordcraft,gridcraft,deckcraft"
