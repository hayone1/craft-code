name: ci

# Checks every way to deploy both options: the static site (Vercel, Netlify), each Helm chart in a
# kind cluster, and each Docker Compose file run for real on the runner. A new chart version on
# main publishes that chart to oci://ghcr.io/hayone1/charts. The repository variable
# WORKSPACE_IMAGE can point the craft-coder tests at another workspace image.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The images change without a commit here.
    - cron: '23 6 * * 1'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Build the static site
        run: node static/build.mjs public
      - name: Check it
        run: |
          set -eu
          test -s public/index.html
          for app in photocraft vectorcraft lightcraft filmcraft effectcraft; do
            test -s "public/$app/index.html"
            grep -q '"vscode-webview://\*"' "public/$app/_embed/config.json"
          done
          # Vercel refuses files of 100 MB or more.
          big=$(find public -type f -size +95M)
          [ -z "$big" ] || { echo "::warning::files near Vercel's 100 MB limit: $big"; }
          du -sh public

  helm-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          set -eu
          c=charts/craft-vscode
          helm lint "$c" --set host=studio.example.com
          helm template t "$c" --set host=studio.example.com --set ingress.enabled=true > /tmp/split.yaml
          helm template t "$c" --set host=studio.example.com --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=gateway' > /tmp/route.yaml
          helm template t "$c" --set publicUrl=http://localhost:8080 --set apps.enabled=false \
            --set relay.enabled=false > /tmp/one.yaml
          grep -c '^kind: Deployment' /tmp/split.yaml | grep -qx 7
          grep -c '^kind: Deployment' /tmp/one.yaml | grep -qx 1
      - name: Start a kind cluster
        uses: helm/kind-action@v1
      - name: Install into the cluster and wait for it
        run: |
          set -eu
          helm install t charts/craft-vscode --set publicUrl=http://localhost:8080 --wait --timeout 10m
          kubectl get pods
          kubectl port-forward svc/t-craft-vscode 8080:8080 >/dev/null 2>&1 &
          for _ in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login)" = 200 ] && break
            sleep 2
          done
          curl -fsS http://localhost:8080/login >/dev/null
          curl -fsS http://localhost:8080/relay/healthz | grep -q ok
          pw=$(kubectl get secret t-craft-vscode -o jsonpath='{.data.password}' | base64 -d)
          curl -s -c /tmp/c -o /dev/null --data-urlencode "password=$pw" http://localhost:8080/login
          grep -q code-server-session /tmp/c
          kubectl exec deploy/t-craft-vscode -- curl -fsS http://t-craft-vscode-photocraft:8080/_embed/config.json \
            | grep -q '"http://localhost:8080"'
          echo PASS

  compose-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate
        run: docker compose -f vscode/docker-compose.yml config --quiet
      - name: Run it and check every part
        run: bash test/vscode-compose.sh

  helm-coder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          set -eu
          c=charts/craft-coder
          helm lint "$c" --set host=coder.example.com
          helm template t "$c" --set host=coder.example.com --set ingress.enabled=true             --set 'wildcardHost=*.coder.example.com' > /tmp/ingress.yaml
          helm template t "$c" --set host=coder.example.com --set httpRoute.enabled=true             --set 'httpRoute.parentRefs[0].name=gateway' > /tmp/route.yaml
          helm template t "$c" --set host=coder.example.com --set postgres.enabled=false             --set postgres.externalUrl=postgres://u:p@db/coder > /tmp/external.yaml
          grep -q 'CODER_WILDCARD_ACCESS_URL, value: "*.coder.example.com"' /tmp/ingress.yaml
          ! grep -q 'kind: StatefulSet' /tmp/external.yaml
      - name: Check the templates
        run: |
          set -eu
          curl -fsSL https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_linux_amd64.zip -o /tmp/tf.zip
          sudo unzip -oq /tmp/tf.zip -d /usr/local/bin terraform
          for t in charts/craft-coder/files/templates/*/; do
            terraform fmt -check -diff "$t"
            (cd "$t" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done
      - name: Start a kind cluster
        uses: helm/kind-action@v1
      - name: Install into the cluster and check every part
        run: bash test/coder-helm.sh ${WORKSPACE_IMAGE:+--set workspaces.image=$WORKSPACE_IMAGE}
        env:
          WORKSPACE_IMAGE: ${{ vars.WORKSPACE_IMAGE }}

  compose-coder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate
        run: docker compose -f coder/docker-compose.yml config --quiet
      - name: Run it and check every part
        run: bash test/coder-compose.sh
        env:
          WORKSPACE_IMAGE: ${{ vars.WORKSPACE_IMAGE }}

  publish-chart:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [helm-vscode, helm-coder]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Push each chart when its version is new
        run: |
          set -eu
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in craft-vscode craft-coder; do
            version=$(sed -n 's/^version: *//p' "charts/$chart/Chart.yaml")
            if helm show chart "oci://ghcr.io/hayone1/charts/$chart" --version "$version" >/dev/null 2>&1; then
              echo "$chart $version is already published"
              continue
            fi
            helm package "charts/$chart" -d /tmp/chart
            helm push "/tmp/chart/$chart-$version.tgz" oci://ghcr.io/hayone1/charts
          done
