name: ci

# Checks every way to deploy: the static site (Vercel, Netlify), the Helm chart, and the Docker
# Compose file run for real on the runner. A change to the chart's version on main publishes the
# chart to oci://ghcr.io/hayone1/charts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The images change without a commit here.
    - cron: '23 6 * * 1'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Build the static site
        run: node static/build.mjs public
      - name: Check it
        run: |
          set -eu
          test -s public/index.html
          for app in photocraft vectorcraft lightcraft filmcraft effectcraft; do
            test -s "public/$app/index.html"
            grep -q '"vscode-webview://\*"' "public/$app/_embed/config.json"
          done
          # Vercel refuses files of 100 MB or more.
          big=$(find public -type f -size +95M)
          [ -z "$big" ] || { echo "::warning::files near Vercel's 100 MB limit: $big"; }
          du -sh public

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          set -eu
          c=charts/craft-studio
          helm lint "$c" --set host=studio.example.com
          helm template t "$c" --set host=studio.example.com --set ingress.enabled=true > /tmp/split.yaml
          helm template t "$c" --set host=studio.example.com --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=gateway' > /tmp/route.yaml
          helm template t "$c" --set publicUrl=http://localhost:8080 --set apps.enabled=false \
            --set relay.enabled=false > /tmp/one.yaml
          grep -c '^kind: Deployment' /tmp/split.yaml | grep -qx 7
          grep -c '^kind: Deployment' /tmp/one.yaml | grep -qx 1
      - name: Start a kind cluster
        uses: helm/kind-action@v1
      - name: Install into the cluster and wait for it
        run: |
          set -eu
          helm install t charts/craft-studio --set publicUrl=http://localhost:8080 --wait --timeout 10m
          kubectl get pods
          kubectl port-forward svc/t-craft-studio 8080:8080 >/dev/null 2>&1 &
          for _ in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login)" = 200 ] && break
            sleep 2
          done
          curl -fsS http://localhost:8080/login >/dev/null
          curl -fsS http://localhost:8080/relay/healthz | grep -q ok
          pw=$(kubectl get secret t-craft-studio -o jsonpath='{.data.password}' | base64 -d)
          curl -s -c /tmp/c -o /dev/null --data-urlencode "password=$pw" http://localhost:8080/login
          grep -q code-server-session /tmp/c
          kubectl exec deploy/t-craft-studio -- curl -fsS http://t-craft-studio-photocraft:8080/_embed/config.json \
            | grep -q '"http://localhost:8080"'
          echo PASS

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate
        run: docker compose config --quiet
      - name: Run it and check every part
        run: bash test/compose.sh

  publish-chart:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Push the chart when its version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/^version: *//p' charts/craft-studio/Chart.yaml)
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          if helm show chart "oci://ghcr.io/hayone1/charts/craft-studio" --version "$version" >/dev/null 2>&1; then
            echo "craft-studio $version is already published"
            exit 0
          fi
          helm package charts/craft-studio -d /tmp/chart
          helm push "/tmp/chart/craft-studio-$version.tgz" oci://ghcr.io/hayone1/charts
