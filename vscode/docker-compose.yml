# Craft VS Code on one server: VS Code in the browser with Claude Code and the craft apps, behind
# automatic HTTPS. The "Deploy on Hostinger" button uses this file; any server with Docker can too:
#
#   docker compose up -d
#   docker compose logs studio | grep Password     # the sign-in password
#
# Needs ports 80 and 443. Every setting is optional (see .env.example):
#   DOMAIN      the address, e.g. studio.example.com, with a DNS record pointing at this server.
#               Without it, the server's public IP address is used as <ip>.sslip.io, which needs
#               no DNS set-up.
#   PASSWORD    the sign-in password. Without it, one is made and printed in the studio's log.
#   ACME_EMAIL  an email address for Let's Encrypt's certificate notices.
#   PHOTOCRAFT  off leaves PhotoCraft out; the same for VECTORCRAFT, LIGHTCRAFT, FILMCRAFT
#               and EFFECTCRAFT. Every app runs by default.
#
# The "setup" service runs once per start: it works out the address, and makes the relay's secrets
# on the first start. The secrets stay in the "setup" volume.
name: craft-vscode

x-app: &app
  restart: unless-stopped
  depends_on:
    setup: { condition: service_completed_successfully }
  volumes: ["setup:/setup:ro"]
  # The app pages answer the editor at this address only.
  entrypoint: ["/bin/sh", "-c", '. /setup/public.env && export EMBED_ORIGINS="https://$$DOMAIN,vscode-webview://*" && exec /craft-start.sh']

services:
  setup:
    image: alpine:3.22
    restart: "no"
    environment:
      DOMAIN: ${DOMAIN:-}
      # One word per app, <name>=<its switch>. An empty switch means the app runs.
      CRAFT_APP_SWITCHES: "photocraft=${PHOTOCRAFT:-} vectorcraft=${VECTORCRAFT:-} lightcraft=${LIGHTCRAFT:-} filmcraft=${FILMCRAFT:-} effectcraft=${EFFECTCRAFT:-}"
    volumes: ["setup:/setup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        domain=$$(printf '%s' "$${DOMAIN:-}" | tr 'A-Z' 'a-z' | sed -e 's#^https\?://##' -e 's#/.*##')
        if [ -z "$$domain" ]; then
          ip=$$(wget -qO- -T 10 https://api.ipify.org || wget -qO- -T 10 https://ifconfig.me/ip)
          echo "$$ip" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$$' || { echo "couldn't find this server's public IP address; set DOMAIN"; exit 1; }
          domain="$$(echo "$$ip" | tr . -).sslip.io"
        fi
        # The apps that run (see the app services at the end of this file).
        apps=""
        for app in $$CRAFT_APP_SWITCHES; do
          case $$app in *=) apps="$${apps:+$$apps,}$${app%=}" ;; esac
        done
        [ -n "$$apps" ] || { echo "every app is off; leave at least one on"; exit 1; }
        printf 'DOMAIN=%s\nCRAFT_APPS=%s\n' "$$domain" "$$apps" > /setup/public.env
        chmod 644 /setup/public.env
        if [ ! -s /setup/private.env ]; then
          secret() { head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32; }
          printf 'MCP_KEY=%s\nMINT_TOKEN=%s\n' "$$(secret)" "$$(secret)" > /setup/private.env
        fi
        # craft-mcp and the studio run as uid 1000.
        chown 1000:1000 /setup/private.env && chmod 600 /setup/private.env
        echo "Craft VS Code: https://$$domain"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes: ["setup:/setup:ro", "caddy-data:/data", "caddy-config:/config"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        . /setup/public.env
        {
          [ -n "$${ACME_EMAIL:-}" ] && printf '{\n\temail %s\n}\n' "$$ACME_EMAIL"
          printf '%s {\n\treverse_proxy studio:8080\n}\n' "$$DOMAIN"
        } > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile

  # VS Code (code-server) with Claude Code and the Craft Apps extension. It also passes
  # https://<DOMAIN>/relay/ on to craft-mcp.
  studio:
    image: hayone/craft-code:latest
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      PASSWORD: ${PASSWORD:-}
      CRAFT_APP_URL: "http://{app}:8080/"
      CRAFT_RELAY_URL: http://craft-mcp:8080
      RELAY_UPSTREAM: craft-mcp:8080
    volumes: ["setup:/setup:ro", "home:/home/coder"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        . /setup/public.env && . /setup/private.env
        export PUBLIC_URL="https://$$DOMAIN" CRAFT_APPS CRAFT_RELAY_TOKEN="$$MINT_TOKEN"
        unset MCP_KEY MINT_TOKEN
        exec /usr/bin/dumb-init /opt/craft-code/entrypoint.sh

  # The relay: the app pages in the browser and the coding agent in VS Code meet here.
  craft-mcp:
    image: hayone/craft-mcp:latest
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    volumes: ["setup:/setup:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        . /setup/public.env && . /setup/private.env
        export MCP_KEY MINT_TOKENS="$$MINT_TOKEN" PUBLIC_HOST="https://$$DOMAIN/relay"
        exec node relay.mjs

  # The app pages. Only the studio reaches them; it shows them through its own port proxy.
  photocraft: { <<: *app, image: "hayone/photocraft:remote", profiles: ["${PHOTOCRAFT:-}"] }
  vectorcraft: { <<: *app, image: "hayone/vectorcraft:remote", profiles: ["${VECTORCRAFT:-}"] }
  lightcraft: { <<: *app, image: "hayone/lightcraft:remote", profiles: ["${LIGHTCRAFT:-}"] }
  filmcraft: { <<: *app, image: "hayone/filmcraft:remote", profiles: ["${FILMCRAFT:-}"] }
  effectcraft: { <<: *app, image: "hayone/effectcraft:remote", profiles: ["${EFFECTCRAFT:-}"] }

volumes:
  setup:
  home:
  caddy-data:
  caddy-config:
